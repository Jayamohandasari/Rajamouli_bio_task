<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('./registration\ bg\ img.jpg'); /* Replace with your image URL */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    form {
      max-width: 500px;
      margin: 50px auto;
      background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white for readability */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    p {
      margin: 15px 0;
    }

    label {
      display: inline-block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    input[type="radio"] {
      margin-right: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <form action="./login.html">
    <h1>Welcome to the Registration Page</h1>
    <p>Please fill in the form below to register.</p>

    <p>
      <label for="Name">Name:</label>
      <input type="text" placeholder="Enter your name" name="Name" id="Name" required>
    </p>

    <p>
      <label for="email">Email:</label>
      <input type="email" placeholder="Enter your email" name="email" id="email" required>
    </p>

    <p>
      <label for="Password">Password:</label>
      <input type="password" placeholder="Enter your Password" name="Password" id="Password" required>
    </p>

    <p>
      <label for="Confirm_Password">Confirm Password:</label>
      <input type="password" placeholder="Confirm your Password" name="Confirm_Password" id="Confirm_Password" required>
    </p>

    <p>
      Gender:<br>
      <input type="radio" id="male" name="gender" value="Male">
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label>
    </p>

    <p>
      <label for="phone">Mobile Number:</label>
      <input type="tel" placeholder="Enter your phone number" name="Mobile_number" id="phone" required>
    </p>

    <p>
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>
    </p>

    <p>
      <label for="Address">Address:</label>
      <textarea name="Address" id="Address" placeholder="Enter your Address" required></textarea>
    </p>

    <p>
      <button type="submit">Submit</button>
    </p>
  </form>

</body>
</html>
